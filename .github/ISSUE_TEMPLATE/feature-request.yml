name: ✨ Feature Request
description: Propose a new feature or integration enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement or new feature!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem or limitation you are facing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Design
      description: Describe the solution or new API design you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
