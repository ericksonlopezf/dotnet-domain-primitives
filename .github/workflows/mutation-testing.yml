name: Mutation Testing (Stryker)

# ─── Purpose ─────────────────────────────────────────────────────────────────
# Runs Stryker.NET mutation testing against EricksonLopez.DomainPrimitives.
# Mutation testing operates as an asynchronous deferred quality gate on `main`
# (and manual/scheduled runs), preventing heavy runs from blocking PRs.
#
# Thresholds (Single Source of Truth in stryker-config.json):
#   • high  (≥100%) — ✅ HIGH (target quality score)
#   • low   (≥ 98%) — 🟡 LOW (acceptable, investigate minor regressions)
#   • break (< 95%) — ❌ FAILED (hard quality gate: non-zero exit code)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      mutation-level:
        description: "Stryker mutation level (Basic, Standard, Advanced)"
        required: false
        default: "Standard"
        type: choice
        options:
          - Basic
          - Standard
          - Advanced
  # Run daily at 04:00 UTC (asynchronous deferred quality gate)
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  mutation-test:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.snk
          fi

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.DomainPrimitives.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.DomainPrimitives.slnx --no-restore --configuration Release

      - name: Install Stryker
        run: dotnet tool install --global dotnet-stryker

      # Stryker reads thresholds directly from stryker-config.json.
      - name: Run Stryker Mutation Testing
        id: stryker
        run: |
          set +e
          dotnet stryker \
            --config-file stryker-config.json \
            --mutation-level ${{ inputs.mutation-level || 'Standard' }} \
            --output StrykerOutput/ci
          STRYKER_EXIT_CODE=$?
          echo "exit_code=$STRYKER_EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Stryker finished with exit code: $STRYKER_EXIT_CODE"
          exit 0

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report-${{ github.run_id }}
          path: StrykerOutput/ci/
          retention-days: 30

      # ─── Post GitHub Commit Status & Step Summary ───────────────────────────
      - name: Record Stryker Result & Publish Commit Status
        id: report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Load thresholds from stryker-config.json
            let thresholds = { high: 100, low: 98, break: 95 };
            try {
              if (fs.existsSync('stryker-config.json')) {
                const config = JSON.parse(fs.readFileSync('stryker-config.json', 'utf8'));
                const t = config['stryker-config']?.thresholds || config.thresholds || {};
                thresholds = { high: t.high ?? 100, low: t.low ?? 98, break: t.break ?? 95 };
              }
            } catch (err) {
              console.warn(`Could not parse stryker-config.json: ${err.message}`);
            }

            // Find JSON report
            let score = 0;
            let killed = 0;
            let total = 0;
            let foundReport = false;

            function findJsonReports(dir) {
              let results = [];
              if (!fs.existsSync(dir)) return results;
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  results = results.concat(findJsonReports(full));
                } else if (entry.name.endsWith('.json') && !entry.name.endsWith('.html.json') && !entry.name.endsWith('metadata.json')) {
                  results.push(full);
                }
              }
              return results;
            }

            const jsonFiles = findJsonReports('StrykerOutput/ci');
            if (jsonFiles.length > 0) {
              try {
                const data = JSON.parse(fs.readFileSync(jsonFiles[0], 'utf8'));
                if (data.mutationScore !== undefined) {
                  score = Number(data.mutationScore);
                }
                const files = data.files || {};
                for (const f of Object.values(files)) {
                  for (const m of (f.mutants || [])) {
                    const st = String(m.status || '').toLowerCase();
                    if (st === 'killed' || st === 'timeout') {
                      killed++;
                      total++;
                    } else if (st === 'survived' || st === 'nocoverage') {
                      total++;
                    }
                  }
                }
                if (total > 0 && data.mutationScore === undefined) {
                  score = Math.round((killed / total) * 10000) / 100;
                }
                foundReport = true;
              } catch (err) {
                console.warn(`Error parsing ${jsonFiles[0]}: ${err.message}`);
              }
            }

            const passedGate = score >= thresholds.break && foundReport;
            let statusLabel = '❌ FAILED';
            if (score >= thresholds.high) statusLabel = '✅ HIGH';
            else if (score >= thresholds.low) statusLabel = '🟡 LOW';
            else if (score >= thresholds.break) statusLabel = '🟠 WARNING';

            const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
            const sha = context.sha;
            const state = passedGate ? 'success' : 'failure';
            const description = `Stryker: ${score}% (${killed}/${total} killed) - ${statusLabel}`;
            const targetUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Save metadata artifact
            const metadata = {
              commit_sha: sha,
              execution_date: new Date().toISOString(),
              mutation_score: score,
              mutants_killed: killed,
              total_mutants: total,
              threshold_high: thresholds.high,
              threshold_low: thresholds.low,
              threshold_break: thresholds.break,
              status: statusLabel,
              passed: passedGate,
              run_url: targetUrl
            };
            fs.writeFileSync('stryker-metadata.json', JSON.stringify(metadata, null, 2));

            // Write Step Summary
            const summary = `
## 🛡️ Stryker Mutation Testing Results

| Metric | Value |
|--------|-------|
| **Mutation Score** | **${score}%** |
| Mutants Killed | ${killed} / ${total} |
| Threshold Break | ≥${thresholds.break}% |
| **Status** | ${statusLabel} |
| Commit SHA | \`${sha.substring(0, 7)}\` |
`;
            core.summary.addRaw(summary).write();

            // Set outputs
            core.setOutput('score', score.toString());
            core.setOutput('passed_gate', passedGate ? 'true' : 'false');
            core.setOutput('status', statusLabel);

            // Post Commit Status
            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: sha,
                state: state,
                context: 'mutation-testing/stryker',
                description: description.substring(0, 140),
                target_url: targetUrl
              });
              console.log(`Commit status successfully published as '${state}' on ${sha}`);
            } catch (err) {
              console.warn(`Could not set commit status: ${err.message}`);
            }

      # ─── Enforce Stryker Quality Gate ───────────────────────────────────────
      - name: Enforce Stryker Quality Gate
        if: always()
        run: |
          STRYKER_CODE="${{ steps.stryker.outputs.exit_code }}"
          PASSED_GATE="${{ steps.report.outputs.passed_gate }}"

          if [ "$STRYKER_CODE" != "0" ] || [ "$PASSED_GATE" != "true" ]; then
            echo "❌ Stryker mutation testing quality gate failed (Exit code: $STRYKER_CODE, Passed Gate: $PASSED_GATE)."
            exit 1
          fi
          echo "✅ Stryker mutation testing quality gate passed successfully."
