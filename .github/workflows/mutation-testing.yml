name: Mutation Testing (Stryker)

on:
  workflow_dispatch:
    inputs:
      mutation-level:
        description: "Stryker mutation level (Basic, Standard, Advanced)"
        required: false
        default: "Standard"
        type: choice
        options:
          - Basic
          - Standard
          - Advanced
  schedule:
    - cron: "0 4 * * 1" # Weekly deep mutation run (Mondays at 4:00 UTC)

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  mutation-test:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 150 # Stryker exhaustive mutation testing can exceed 60m; 150m prevents premature timeout while guarding against hangs
    permissions:
      contents: read
      statuses: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.snk
          fi

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.DomainPrimitives.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.DomainPrimitives.slnx --no-restore --configuration Release

      - name: Install Stryker
        run: dotnet tool install --global dotnet-stryker

      - name: Run Stryker Mutation Testing
        id: stryker
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Running scheduled weekly deep mutation testing (Advanced)..."
            dotnet stryker \
              --config-file stryker-config.json \
              --mutation-level Advanced \
              --output StrykerOutput/ci
          else
            MUTATION_LVL="${{ inputs.mutation-level || 'Standard' }}"
            echo "Running main branch mutation testing with level: $MUTATION_LVL..."
            dotnet stryker \
              --config-file stryker-config.json \
              --mutation-level "$MUTATION_LVL" \
              --output StrykerOutput/ci
          fi
        continue-on-error: true

      - name: Upload Stryker HTML/JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report-${{ github.sha }}
          path: StrykerOutput/ci/
          retention-days: 30

      - name: Extract, Report Mutation Score & Update Commit Status
        if: always()
        id: record_result
        env:
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRYKER_OUTCOME: ${{ steps.stryker.outcome }}
        run: |
          python3 .github/scripts/record-stryker-result.py StrykerOutput/ci stryker-config.json

      - name: Upload Stryker Metadata Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-metadata-${{ github.sha }}
          path: stryker-metadata.json
          retention-days: 30

      - name: Enforce Stryker Quality Gate
        if: always()
        run: |
          if [ "${{ steps.stryker.outcome }}" != "success" ] || [ "${{ steps.record_result.outcome }}" != "success" ]; then
            echo "::error::Stryker mutation quality gate failed (score < 95% or mutation run error)."
            exit 1
          fi
          echo "Stryker mutation quality gate passed successfully."
